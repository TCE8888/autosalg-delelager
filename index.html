<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Delelager Tilbud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --surface-2:#F5F7F8; --line:#D5DBE0; --line-strong:#AEB8C1;
  --ink:#16202A; --ink-2:#4A5763; --ink-3:#71808D;
  --accent:#C4302A; --accent-ink:#FFFFFF; --accent-soft:#FBE6E4; --info:#1E5A8C; --info-soft:#E2ECF5; --neutral-soft:#E6E9EC;
  --ok:#2E7D4F; --ok-soft:#E3F2E8; --warn:#9A6200; --warn-soft:#FBF0DA; --bad:#B23A30; --bad-soft:#F8E4E2;
  --plate-blue:#1D3F9A;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F151B; --surface:#172029; --surface-2:#1D2833; --line:#2A3743; --line-strong:#3E4E5C;
    --ink:#E6ECF1; --ink-2:#AEBBC6; --ink-3:#83929F;
    --accent:#F0685E; --accent-ink:#1A0B0A; --accent-soft:#3A1E1C; --info:#7DB3E3; --info-soft:#1D3347; --neutral-soft:#26313B;
    --ok:#6CC592; --ok-soft:#173226; --warn:#E3B055; --warn-soft:#352A14; --bad:#EE8B80; --bad-soft:#3A1E1C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F151B; --surface:#172029; --surface-2:#1D2833; --line:#2A3743; --line-strong:#3E4E5C;
  --ink:#E6ECF1; --ink-2:#AEBBC6; --ink-3:#83929F;
  --accent:#F0685E; --accent-ink:#1A0B0A; --accent-soft:#3A1E1C; --info:#7DB3E3; --info-soft:#1D3347; --neutral-soft:#26313B;
  --ok:#6CC592; --ok-soft:#173226; --warn:#E3B055; --warn-soft:#352A14; --bad:#EE8B80; --bad-soft:#3A1E1C;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{background:#15181C;border-bottom:3px solid #D5382F;color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:baseline;gap:8px}
.wordmark{font-family:var(--f-display);font-weight:600;letter-spacing:.32em;font-size:19px}
.logo{height:20px;width:auto;display:block}
.brand{align-items:center!important}
.brand small{color:#A9B0B8!important;font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:.08em;color:var(--ink-3)}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{border:1px solid transparent;background:none;color:#C9CED4;font:500 14px var(--f-body);padding:7px 12px;border-radius:6px;cursor:pointer}
.tab:hover{background:#262B31;color:#fff}
.tab[aria-current="page"]{background:#D5382F;color:#fff;border-color:#D5382F}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:28px;line-height:1.15}
h2{font-size:20px}
h3{font-size:16px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:24px 16px}
.muted{color:var(--ink-3)}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.pad{padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 14px var(--f-body);padding:9px 16px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:8px 10px;width:100%}
textarea{min-height:84px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.sendt{background:var(--info-soft);color:var(--info)}
.chip.bestilt{background:var(--ok-soft);color:var(--ok)}
.chip.avvist{background:var(--neutral-soft);color:var(--ink-2)}
.chip.lager{background:var(--ok-soft);color:var(--ok)}
.chip.bestilling{background:var(--warn-soft);color:var(--warn)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
/* Norwegian plate */
.plate{display:inline-flex;align-items:stretch;border:2px solid #111;border-radius:4px;background:#fff;color:#111;font:600 15px var(--f-mono);letter-spacing:.08em;overflow:hidden;line-height:1}
.plate b{background:var(--plate-blue);color:#fff;font:600 9px var(--f-body);display:flex;align-items:flex-end;padding:3px 3px 2px;letter-spacing:0}
.plate span{padding:5px 8px}
/* table */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;background:var(--surface-2)}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
tbody tr:hover{background:var(--surface-2)}
/* customer view */
.cust{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start;padding-top:24px}
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.orderhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;padding:20px;border-bottom:1px solid var(--line)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;padding:20px;border-bottom:1px solid var(--line)}
.meta .v{font-weight:500}
.kolli{padding:20px;display:flex;flex-direction:column;gap:12px}
.line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
.line.removed{opacity:.45}
.line .name{font-weight:600}
.line .sub{font-size:13px;color:var(--ink-3)}
.line .tot{font-weight:600;text-align:right}
.step{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--surface)}
.step button{width:32px;border:none;background:none;color:var(--ink);font:600 16px var(--f-body);cursor:pointer}
.step button:hover{background:var(--surface-2)}
.step output{min-width:34px;text-align:center;padding:6px 0;font-weight:600;border-inline:1px solid var(--line)}
.linkbtn{background:none;border:none;padding:0;color:var(--accent);font:500 13px var(--f-body);cursor:pointer;text-decoration:underline}
.section{padding:20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.pickup{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.radios{display:flex;flex-direction:column;gap:8px}
.radios label,.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.radios input,.checks input{width:auto;margin-top:3px;accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:none;background:var(--surface);color:var(--ink-2);font:500 14px var(--f-body);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.sumrow.total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:18px;font-weight:600}
.checks{display:flex;flex-direction:column;gap:10px;font-size:14px}
.banner{padding:12px 14px;border-radius:6px;font-weight:500}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.err{color:var(--bad);font-size:13px;font-weight:500}
/* editor */
.edline{display:grid;grid-template-columns:120px minmax(0,1fr) 80px 120px 150px auto;gap:8px;align-items:end}
.mail{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:14px;white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:500;z-index:20}
.empty{padding:32px 20px;text-align:center;color:var(--ink-3)}
.confirmrow{display:inline-flex;gap:6px;align-items:center}
@media (max-width:860px){
  .cust{grid-template-columns:1fr}
  .summary{position:static}
  .edline{grid-template-columns:1fr 1fr}
  .edline .wide{grid-column:1/-1}
}
@media (max-width:480px){
  .line{grid-template-columns:1fr;}
  .line .tot{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>

<script>
/* ---------- settings ---------- */
const LINK_BASE = location.href.split("#")[0]; // artifact-lenken; kunden åpner LINK_BASE + "#t<ordrenr>"
const LAGER = { navn:"Autosalg AS – Delelager", adresse:"Storetveitvegen 58, 5067 Bergen", apning:"07:00–15:00", telefon:"55 36 10 00" };
const MVA = 0.25;

/* ---------- helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kr = n => (Number(n)||0).toLocaleString("nb-NO",{minimumFractionDigits:2,maximumFractionDigits:2})+" kr";
const dato = iso => iso ? new Date(iso).toLocaleDateString("nb-NO",{day:"2-digit",month:"2-digit",year:"numeric"}) : "";
const tid = iso => iso ? new Date(iso).toLocaleString("nb-NO",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
const plate = r => `<span class="plate"><b>N</b><span>${esc((r||"").toUpperCase())}</span></span>`;
const statusTxt = {sendt:"Venter på kunde",bestilt:"Bestilt",avvist:"Avvist"};
const linkFor = id => (LINK_BASE.startsWith("http") ? LINK_BASE : "[lenke til tilbudssiden]") + "#t" + id;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
async function copy(text){
  try{await navigator.clipboard.writeText(text);toast("Kopiert")}
  catch(e){toast("Kunne ikke kopiere automatisk – marker teksten og kopier manuelt")}
}
function totals(linjer,rabattPst){
  const brutto = linjer.reduce((s,l)=>s+(Number(l.antall)||0)*(Number(l.pris)||0),0);
  const rabatt = brutto*(Number(rabattPst)||0)/100;
  const sum = brutto-rabatt;
  return {brutto,rabatt,sum,mva:sum-sum/(1+MVA)};
}

let custState={};      // per-offer customer edits (id -> {...})

function loadAll(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return JSON.parse(JSON.stringify(SEED))}
let store=loadAll(); const listeners=new Set();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){} emit()}
function emit(){const docs=Object.entries(store).sort((a,b)=>(b[1].opprettet||"").localeCompare(a[1].opprettet||"")).map(([id,d])=>({id,data:()=>d}));listeners.forEach(f=>f({docs}))}
window.addEventListener("storage",e=>{if(e.key===KEY){store=loadAll();emit()}});
db={
  collection(){return {orderBy(){return this},onSnapshot(cb){listeners.add(cb);setTimeout(()=>cb({docs:Object.entries(store).sort((a,b)=>(b[1].opprettet||"").localeCompare(a[1].opprettet||"")).map(([id,d])=>({id,data:()=>d}))}),0);return()=>listeners.delete(cb)}}},
  doc(path){const id=path.split("/")[1];return{
    async set(d){store[id]=JSON.parse(JSON.stringify(d));persist()},
    async update(d){if(!store[id])throw{code:"invalid_argument"};store[id]={...store[id],...JSON.parse(JSON.stringify(d))};persist()},
    async delete(){delete store[id];persist()}}}
};
dbState="ok";
db.collection("tilbud").orderBy("opprettet","desc").onSnapshot(snap=>{offers=snap.docs.map(d=>({id:d.id,...d.data()}));loaded=true;render();});

/* ---------- render ---------- */
function render(){
  const r=route();
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current", (t.dataset.go===r || (t.dataset.go==="" && r==="")) ? "page":"false"));
  const app=$("#app");
  if(r.startsWith("t") && r.length>1) return renderCustomer(app, r.slice(1));
  if(r==="ny") return renderEditor(app);
  return renderList(app);
}

function dbNotice(){
  if(dbState==="mangler") return `<div class="banner warn" style="margin-bottom:16px">Lagring er ikke tilgjengelig i denne visningen. Tilbud kan ikke lagres eller hentes.</div>`;
  if(dbState==="feil") return `<div class="banner bad" style="margin-bottom:16px">Klarte ikke å hente tilbud. Last siden på nytt.</div>`;
  return "";
}

/* ----- list (lager) ----- */
let confirmDel=null;
function renderList(app){
  const count = s => offers.filter(o=>o.status===s).length;
  app.innerHTML = `
  <div class="pagehead">
    <div><div class="lbl">Delelager</div><h1>Tilbud til kunder</h1></div>
    <button class="btn primary" data-act="new">+ Nytt tilbud</button>
  </div>
  ${dbNotice()}
  <div class="panel">
    <div class="pad" style="display:flex;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--line)">
      <span class="chip sendt">${count("sendt")} venter på kunde</span>
      <span class="chip bestilt">${count("bestilt")} bestilt</span>
      <span class="chip avvist">${count("avvist")} avvist</span>
    </div>
    ${!loaded ? `<div class="empty">Henter tilbud…</div>` : offers.length===0 ? `<div class="empty">Ingen tilbud ennå. Lag det første med «Nytt tilbud».</div>` : `
    <div class="tablewrap"><table>
      <thead><tr><th>Ordrenr</th><th>Dato</th><th>Kunde</th><th>Kjøretøy</th><th class="r">Sum</th><th>Status</th><th></th></tr></thead>
      <tbody>${offers.map(o=>{
        const t=totals(o.linjer||[],o.rabattPst);
        return `<tr>
          <td class="mono">${esc(o.id)}</td>
          <td class="num">${dato(o.opprettet)}</td>
          <td><div style="font-weight:600">${esc(o.kunde?.firma)}</div><div class="muted" style="font-size:13px">${esc(o.kunde?.kontakt||"")}</div></td>
          <td>${plate(o.regnr)}<div class="muted" style="font-size:13px;margin-top:4px">${esc(o.modell)}</div></td>
          <td class="r num">${kr(t.sum)}</td>
          <td><span class="chip ${o.status}">${statusTxt[o.status]||o.status}</span>${o.status==="bestilt"?`<div class="muted" style="font-size:12px;margin-top:4px">${tid(o.bestiltTid)}</div>`:""}${o.kommentar?`<div style="font-size:13px;margin-top:4px;max-width:220px">«${esc(o.kommentar)}»</div>`:""}</td>
          <td style="white-space:nowrap">
            <button class="btn sm" data-act="open" data-id="${esc(o.id)}">Åpne</button>
            <button class="btn sm" data-act="copy" data-id="${esc(o.id)}">Kopier lenke</button>
            ${confirmDel===o.id
              ? `<span class="confirmrow"><button class="btn sm danger" data-act="del2" data-id="${esc(o.id)}">Slett</button><button class="btn sm" data-act="delno">Avbryt</button></span>`
              : `<button class="btn sm" data-act="del" data-id="${esc(o.id)}" aria-label="Slett tilbud">🗑</button>`}
          </td></tr>`}).join("")}
      </tbody></table></div>`}
  </div>`;
  app.onclick = async e=>{
    const b=e.target.closest("[data-act]"); if(!b) return;
    const id=b.dataset.id;
    if(b.dataset.act==="new"){draft=null;saved=null;go("ny")}
    if(b.dataset.act==="open") go("t"+id);
    if(b.dataset.act==="copy") copy(linkFor(id));
    if(b.dataset.act==="del"){confirmDel=id;render()}
    if(b.dataset.act==="delno"){confirmDel=null;render()}
    if(b.dataset.act==="del2"){confirmDel=null;try{await db.doc("tilbud/"+id).delete();toast("Tilbud slettet")}catch(err){toast("Kunne ikke slette")}}
  };
}

/* ----- editor (lager lager tilbud) ----- */
function nextId(){
  const max = offers.reduce((m,o)=>Math.max(m,parseInt(o.id,10)||0),8360000);
  return String(max+1);
}
function newLine(){return {id:Math.random().toString(36).slice(2,8),varenr:"",navn:"",antall:1,pris:0,lager:"lager",info:""}}
function renderEditor(app){
  if(!draft) draft={kunde:{firma:"",kontakt:"",epost:"",telefon:"",adresse:""},regnr:"",modell:"",rabattPst:0,linjer:[newLine()],merknad:""};
  if(saved){
    const o=offers.find(x=>x.id===saved);
    const link=linkFor(saved);
    const mail=`Hei ${o?.kunde?.firma||""},\n\nSe tilbud på delebestilling via lenken under.\n\nOrdrenr: ${saved}\nRegistreringsnummer: ${(o?.regnr||"").toUpperCase()}\nModell: ${o?.modell||""}\nÅpningstider for henting av deler: ${LAGER.apning}\n\nSe og eventuelt godkjenn tilbudet ditt her:\n${link}\n\nMed vennlig hilsen\n${LAGER.navn}`;
    app.innerHTML=`
    <div class="pagehead"><div><div class="lbl">Tilbud ${esc(saved)}</div><h1>Tilbudet er lagret</h1></div></div>
    <div class="panel pad stack">
      <div class="banner ok">Send lenken til kunden. Når kunden trykker «Bekreft og bestill», endres status til Bestilt i listen.</div>
      <label class="f">Lenke til kunden<input id="lnk" readonly value="${esc(link)}"></label>
      <div class="lbl">Forslag til e-post / SMS</div>
      <div class="mail" id="mailtxt">${esc(mail)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" data-act="cl">Kopier lenke</button>
        <button class="btn" data-act="cm">Kopier e-posttekst</button>
        <button class="btn" data-act="pv">Se kundens visning</button>
        <button class="btn" data-act="nw">Lag nytt tilbud</button>
      </div>
    </div>`;
    app.onclick=e=>{const a=e.target.closest("[data-act]")?.dataset.act;
      if(a==="cl")copy(link); if(a==="cm")copy(mail); if(a==="pv")go("t"+saved);
      if(a==="nw"){draft=null;saved=null;render()} };
    app.oninput=null;
    return;
  }
  const d=draft, t=totals(d.linjer,d.rabattPst);
  app.innerHTML=`
  <div class="pagehead"><div><div class="lbl">Delelager</div><h1>Nytt tilbud</h1></div></div>
  ${dbNotice()}
  <form id="ed" class="stack" novalidate>
    <div class="panel pad stack">
      <h3>Kunde</h3>
      <div class="grid2">
        <label class="f">Firma *<input id="k_firma" value="${esc(d.kunde.firma)}" required></label>
        <label class="f">Kontaktperson<input id="k_kontakt" value="${esc(d.kunde.kontakt)}"></label>
        <label class="f">E-post<input id="k_epost" type="email" value="${esc(d.kunde.epost)}"></label>
        <label class="f">Telefon<input id="k_telefon" value="${esc(d.kunde.telefon)}"></label>
        <label class="f">Adresse<input id="k_adresse" value="${esc(d.kunde.adresse)}"></label>
      </div>
      <h3 style="margin-top:8px">Kjøretøy</h3>
      <div class="grid2">
        <label class="f">Registreringsnummer *<input id="regnr" class="mono" value="${esc(d.regnr)}" placeholder="EB12345" style="text-transform:uppercase"></label>
        <label class="f">Modell<input id="modell" value="${esc(d.modell)}" placeholder="Peugeot e-2008 GT Line 136 hk"></label>
      </div>
    </div>
    <div class="panel pad stack">
      <h3>Deler</h3>
      ${d.linjer.map((l,i)=>`
        <div class="edline" data-i="${i}">
          <label class="f">Varenr<input data-k="varenr" class="mono" value="${esc(l.varenr)}"></label>
          <label class="f wide">Beskrivelse *<input data-k="navn" value="${esc(l.navn)}" placeholder="Bremseslange foran"></label>
          <label class="f">Antall<input data-k="antall" type="number" min="1" step="1" value="${esc(l.antall)}"></label>
          <label class="f">Pris pr stk inkl. mva<input data-k="pris" type="number" min="0" step="0.01" value="${esc(l.pris)}"></label>
          <label class="f">Tilgjengelighet<select data-k="lager"><option value="lager" ${l.lager==="lager"?"selected":""}>På lager</option><option value="bestilling" ${l.lager==="bestilling"?"selected":""}>Bestillingsvare</option></select></label>
          <button type="button" class="btn sm" data-act="rm" data-i="${i}" ${d.linjer.length<2?"disabled":""}>Fjern</button>
          ${l.lager==="bestilling"?`<label class="f wide" style="grid-column:1/-1">Leveringsinfo<input data-k="info" value="${esc(l.info)}" placeholder="Lagerført i Oslo – klar neste virkedag"></label>`:""}
        </div>`).join("")}
      <div><button type="button" class="btn" data-act="add">+ Legg til del</button></div>
      <div class="grid2" style="align-items:end">
        <label class="f">Rabatt %<input id="rabattPst" type="number" min="0" max="100" step="0.5" value="${esc(d.rabattPst)}"></label>
        <div class="num" style="text-align:right"><div class="muted">Sum inkl. mva</div><div style="font-size:22px;font-weight:600" id="edsum">${kr(t.sum)}</div></div>
      </div>
      <label class="f">Merknad til kunden (valgfritt)<textarea id="merknad" placeholder="F.eks. bestillingsfrist kl 15:30 for levering neste virkedag">${esc(d.merknad)}</textarea></label>
    </div>
    <div id="ederr" class="err" hidden></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" type="submit" ${dbState!=="ok"?"disabled":""}>Lagre og lag lenke</button>
      <button class="btn" type="button" data-act="cancel">Avbryt</button>
    </div>
  </form>`;
  const form=$("#ed");
  app.oninput=e=>{
    const el=e.target;
    if(el.id?.startsWith("k_")) d.kunde[el.id.slice(2)]=el.value;
    else if(["regnr","modell","rabattPst","merknad"].includes(el.id)) d[el.id]=el.value;
    else if(el.dataset.k){const i=+el.closest("[data-i]").dataset.i; d.linjer[i][el.dataset.k]=el.value; if(el.dataset.k==="lager") return render();}
    $("#edsum").textContent=kr(totals(d.linjer,d.rabattPst).sum);
  };
  app.onchange=e=>{ if(e.target.dataset.k==="lager") render(); };
  app.onclick=e=>{const b=e.target.closest("[data-act]");if(!b)return;
    if(b.dataset.act==="add"){d.linjer.push(newLine());render()}
    if(b.dataset.act==="rm"){d.linjer.splice(+b.dataset.i,1);render()}
    if(b.dataset.act==="cancel"){draft=null;go("")}
  };
  form.onsubmit=async e=>{
    e.preventDefault();
    const errEl=$("#ederr");
    const linjer=d.linjer.filter(l=>l.navn.trim()).map(l=>({id:l.id,varenr:l.varenr.trim(),navn:l.navn.trim(),antall:Math.max(1,parseInt(l.antall,10)||1),pris:Math.round((parseFloat(l.pris)||0)*100)/100,lager:l.lager,info:l.lager==="bestilling"?l.info.trim():""}));
    const miss=[];
    if(!d.kunde.firma.trim())miss.push("firma");
    if(!d.regnr.trim())miss.push("registreringsnummer");
    if(!linjer.length)miss.push("minst én del med beskrivelse");
    if(miss.length){errEl.textContent="Fyll inn "+miss.join(", ")+".";errEl.hidden=false;return}
    errEl.hidden=true;
    const id=nextId();
    const doc={ordrenr:id,opprettet:new Date().toISOString(),status:"sendt",
      kunde:Object.fromEntries(Object.entries(d.kunde).map(([k,v])=>[k,v.trim()])),
      regnr:d.regnr.trim().toUpperCase().replace(/\s+/g,""),modell:d.modell.trim(),
      rabattPst:parseFloat(d.rabattPst)||0,linjer,merknad:d.merknad.trim(),
      lager:LAGER};
    try{ await db.doc("tilbud/"+id).set(doc); saved=id; draft=null; render(); }
    catch(err){ errEl.textContent= err?.code==="quota_exceeded" ? "Lageret er fullt – slett gamle tilbud og prøv igjen." : "Kunne ikke lagre tilbudet. Prøv igjen."; errEl.hidden=false; }
  };
}

/* ----- customer view (kunden åpner lenken) ----- */
function renderCustomer(app,id){
  const o=offers.find(x=>x.id===id);
  if(!o){
    app.innerHTML = `<div class="pagehead"><h1>Tilbud ${esc(id)}</h1></div>${dbNotice()}<div class="panel empty">${loaded?"Fant ikke dette tilbudet. Det kan være slettet, eller lenken er feil.":"Henter tilbud…"}</div>`;
    app.onclick=null; return;
  }
  const locked = o.status!=="sendt";
  if(!custState[id]) custState[id]={
    antall:Object.fromEntries((o.linjer||[]).map(l=>[l.id,l.antall])),
    levering:o.levering||"hentes", hentevalg:o.hentevalg||"samlet", betaling:o.betaling||"faktura",
    referanse:o.referanse||"", kommentar:o.kommentar||"", c1:false, c2:false, err:"", sending:false, avvisSp:false };
  const s=custState[id];
  const linjer=(o.linjer||[]).map(l=>({...l,antall: locked? l.antall : s.antall[l.id]}));
  const t=totals(linjer,o.rabattPst);
  const lager=o.lager||LAGER;
  const dis = locked?"disabled":"";

  app.innerHTML=`

      <div class="orderhead">

        <div class="muted num">Dato: ${dato(o.opprettet)}</div>
      </div>
      ${o.status==="bestilt"?`<div class="pad" style="padding-bottom:0"><div class="banner ok">Bestilt ${tid(o.bestiltTid)}. Takk – delelageret har mottatt bestillingen.</div></div>`:""}
      ${o.status==="avvist"?`<div class="pad" style="padding-bottom:0"><div class="banner bad">Tilbudet ble avvist ${tid(o.bestiltTid)}.</div></div>`:""}

        <div><div class="lbl">Kjøretøy</div><div style="margin:4px 0">${plate(o.regnr)}</div><div class="v">${esc(o.modell)}</div></div>
      </div>
      <div class="kolli">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center">
          <h2>Artikler <span class="muted" style="font-size:14px;font-family:var(--f-body);font-weight:500">${linjer.filter(l=>l.antall>0).length} varer</span></h2>

        </div>
        ${linjer.map(l=>`

            <div class="step" aria-label="Antall">
              <button type="button" data-act="minus" data-l="${esc(l.id)}" ${dis} aria-label="Færre">−</button>
              <output class="num">${l.antall}</output>
              <button type="button" data-act="plus" data-l="${esc(l.id)}" ${dis} aria-label="Flere">+</button>
            </div>

              <div class="name">${esc(l.navn)}</div>

      </div>

      <div class="section">
        <h3>Kommentar og ordrelinje</h3>
        <label class="f">Kommentar til delelageret<textarea id="c_kom" ${dis} placeholder="Skriv inn eventuelle kommentarer her">${esc(s.kommentar)}</textarea></label>
      </div>
    </div>

    <aside class="panel pad summary stack">
      <h2>Oppsummering</h2>
      <div>
        <div class="sumrow"><span class="muted">Sammenlagt pris</span><span class="num">${kr(t.brutto)}</span></div>
        <div class="sumrow"><span class="muted">Rabatt${o.rabattPst?` (${o.rabattPst} %)`:""}</span><span class="num">−${kr(t.rabatt)}</span></div>
        <div class="sumrow total"><span>Sum</span><span class="num">${kr(t.sum)}</span></div>
        <div class="sumrow" style="font-size:13px"><span class="muted">Herav mva 25 %</span><span class="num muted">${kr(t.mva)}</span></div>
      </div>
      <div style="border-top:1px solid var(--line);padding-top:12px">
        <div class="sumrow"><span class="muted">Levering</span><span>${s.levering==="hentes"?"Hentes hos lageret":"Sendes"}</span></div>
        ${s.levering==="hentes"?`<div class="sumrow"><span class="muted">Leveringsvalg</span><span>${s.hentevalg==="samlet"?"Samlet bestilling":"Fortløpende"}</span></div>`:""}
        <div class="sumrow"><span class="muted">Betaling</span><span>${s.betaling==="faktura"?"Faktura":"Kontant"}</span></div>
        <div class="sumrow"><span class="muted">Referanse</span><span class="mono">${esc(s.referanse)||"–"}</span></div>
      </div>
      ${locked?`<span class="chip ${o.status}" style="align-self:flex-start">${statusTxt[o.status]}</span>`:`
      <div class="checks">
        <label><input type="checkbox" id="c1" ${s.c1?"checked":""}><span>Jeg har lest gjennom ordren og bekrefter at informasjonen er korrekt og fullstendig *</span></label>
        <label><input type="checkbox" id="c2" ${s.c2?"checked":""}><span>Jeg har lest og godkjenner vilkår for handelen *</span></label>
      </div>
      ${s.err?`<div class="err">${esc(s.err)}</div>`:""}
      <button class="btn primary" data-act="bestill" ${s.sending?"disabled":""}>${s.sending?"Sender…":"Bekreft og bestill"}</button>
      ${s.avvisSp
        ? `<div class="stack" style="gap:8px"><span style="font-size:14px">Vil du avvise tilbudet?</span><div style="display:flex;gap:8px"><button class="btn sm danger" data-act="avvis2">Ja, avvis</button><button class="btn sm" data-act="avvisno">Nei</button></div></div>`
        : `<button class="linkbtn" style="align-self:flex-start" data-act="avvis">Avvis tilbudet</button>`}`}
    </aside>
  </div>`;

  app.oninput=e=>{
    if(e.target.id==="c_ref"){s.referanse=e.target.value; const ref=app.querySelectorAll(".summary .sumrow .mono"); if(ref[0]) ref[0].textContent=s.referanse||"–";}
    if(e.target.id==="c_kom") s.kommentar=e.target.value;
  };
  app.onchange=e=>{
    if(e.target.name==="hv"){s.hentevalg=e.target.value;render()}
    if(e.target.id==="c1"){s.c1=e.target.checked;s.err=""}
    if(e.target.id==="c2"){s.c2=e.target.checked;s.err=""}
  };
  app.onclick=async e=>{
    const b=e.target.closest("[data-act]"); if(!b||locked) return;
    const a=b.dataset.act, lid=b.dataset.l;
    if(a==="plus"){s.antall[lid]++;render()}
    if(a==="minus"){s.antall[lid]=Math.max(0,s.antall[lid]-1);render()}
    if(a==="fjern"){s.antall[lid]=0;render()}
    if(a==="angre"){s.antall[lid]=(o.linjer.find(l=>l.id===lid)?.antall)||1;render()}
    if(a==="lev"){s.levering=b.dataset.v;render()}
    if(a==="bet"){s.betaling=b.dataset.v;render()}
    if(a==="avvis"){s.avvisSp=true;render()}
    if(a==="avvisno"){s.avvisSp=false;render()}
    if(a==="avvis2"){
      try{await db.doc("tilbud/"+id).update({status:"avvist",bestiltTid:new Date().toISOString(),kommentar:s.kommentar.trim()});toast("Tilbudet er avvist")}
      catch(err){s.err="Kunne ikke avvise. Prøv igjen.";render()}
    }
    if(a==="bestill"){
      if(!s.c1||!s.c2){s.err="Kryss av for begge bekreftelsene før du bestiller.";return render()}
      const nye=linjer.filter(l=>l.antall>0);
      if(!nye.length){s.err="Bestillingen har ingen varer. Øk antall på minst én vare.";return render()}
      if(!db){s.err="Bestillingen kan ikke sendes fra denne visningen.";return render()}
      s.sending=true;s.err="";render();
      try{
        await db.doc("tilbud/"+id).update({status:"bestilt",bestiltTid:new Date().toISOString(),linjer:nye,
          levering:s.levering,hentevalg:s.hentevalg,betaling:s.betaling,referanse:s.referanse.trim(),kommentar:s.kommentar.trim()});
        s.sending=false; toast("Bestillingen er sendt");
      }catch(err){s.sending=false;s.err="Bestillingen ble ikke sendt. Prøv igjen.";render()}
    }
  };
}

render();
</script>

<footer class="wrap muted" style="font-size:12px;padding-block:0 24px">Demoversjon – tilbud lagres bare i denne nettleseren.</footer>
</body>
